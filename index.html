<script>

  bar.append(sel('size',[['s','작게'],['m','보통'],['l','크게'],['xl','아주 크게']],'m','글자 크기'),sel('font',[['sans','고딕'],['serif','명조'],['mono','고정폭']],'sans','글꼴'),tog('bold','B','굵게'),tog('italic','I','기울임'),al('left','왼쪽'),al('center','가운데'),al('right','오른쪽'));

async function resolve(){}

const SC=['#4a77a8','#4d7d6b','#7a6a98','#8f7038','#587b88','#96616f'];
function render(){
  const pend=posts.filter(p=>p.approved===false).length;
  $('#who').replaceChildren(...(uid?[h('span',{},names[uid]||'참여자'),admin?h('span',{class:'chip'},'관리자'):null,
    admin?h('button',{class:requireApproval?'btn sm':'btn sm ghost',role:'switch','aria-checked':requireApproval?'true':'false',title:'켜면 학생이 올린 글은 관리자가 승인해야 보여요',onclick:toggleApproval},'게시물 승인 '+(requireApproval?'ON':'OFF')):null,
    admin&&pend?h('span',{class:'chip'},'승인 대기 '+pend):null,
    h('button',{class:'btn sm ghost',onclick:accountSettings},'계정 설정'),h('button',{class:'btn sm ghost',onclick:()=>sb.auth.signOut()},'로그아웃')].filter(Boolean):[]));
  const b=$('#board');b.replaceChildren();
  sections.forEach((sec,i)=>{
    const list=posts.filter(p=>p.section===sec);
    b.append(h('section',{class:'col','aria-label':sec,style:'--sc:'+SC[i%SC.length]},
      h('div',{class:'colh'},h('span',{},sec,h('small',{},String(list.length))),
        h('span',{class:'row'},admin&&sections.length>1?h('button',{class:'ib','aria-label':sec+' 열 삭제',title:'열 삭제',onclick:()=>delSection(sec)},'🗑'):null,canWrite?h('button',{class:'ib','aria-label':sec+' 열에 게시물 추가',onclick:()=>compose(sec)},'+'):null)),
      list.map(card),
      list.length?null:h('p',{class:'empty'},'아직 게시물이 없어요. + 버튼으로 첫 글을 올려보세요.')));
  });
  if(admin)b.append(h('button',{class:'addcol',onclick:addSection},'+ 열 추가'));

}

function card(p){
  const n=comments.filter(c=>c.postId===p.id).length;
  const open=()=>{openId=p.id;renderDetail()};
  const ex=(p.paras||[]).map(x=>x.text).join(' ').slice(0,90);

    h('b',{},p.title||'제목 없음'),ex?h('p',{class:'ex'},ex):null,
    h('div',{class:'meta'},h('span',{class:'who'},h('i',{class:'av'},(nm(p.authorId)||'?').charAt(0)),nm(p.authorId)),n?h('span',{},'댓글 '+n):null,p.approved===false?h('span',{class:'chip'},'승인 대기'):null));
}

function compose(sec){
  if(!uid)return toast('로그인 정보를 확인할 수 없어요.');
  const t=h('input',{placeholder:'제목',maxlength:'100','aria-label':'제목'});
  const b=h('textarea',{rows:'8',placeholder:'내용을 입력하세요. 빈 줄로 문단을 나눠요.','aria-label':'내용'});

  show(h('div',{class:'row'},h('h2',{},sec+' 열에 게시'),closeBtn()),t,fmtBar(f,()=>applyFmt(b,f)),b,
    h('div',{class:'row end'},h('button',{class:'btn',onclick:async()=>{
      const paras=b.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(text=>({id:rid(),text}));
      if(!t.value.trim()&&!paras.length)return toast('제목이나 내용을 입력해 주세요.');

    }},'게시하기')));

}

function delSection(sec){

  show(h('div',{class:'row'},h('h2',{},'열 삭제'),closeBtn()),
    h('p',{},'‘'+sec+'’ 열을 삭제할까요?'+(ps.length?' 이 열의 게시물 '+ps.length+'개와 댓글도 함께 삭제되며 되돌릴 수 없어요.':'')),

      h('button',{class:'btn ghost warn',onclick:async()=>{

function addSection(){

}

function renderDetail(){

      :h('p',{class:'hint'},'관리자 승인을 기다리는 중이에요. 승인되기 전에는 나와 관리자만 볼 수 있어요.')):null,
    canEdit(p)?h('div',{class:'row'},

      h('button',{class:'btn ghost warn',onclick:()=>{if(confirmDel===p.id)delPost(p);else{confirmDel=p.id;renderDetail()}}},confirmDel===p.id?'정말 삭제할까요?':'삭제')):null,
    h('h3',{},'댓글 '+cs.length),
    cs.map(c=>h('div',{class:'cm'},

/* ---- 문단별 수정 ---- */
function lock(p,pid){
  if(Date.now()-(lastLock[pid]||0)<30000)return;lastLock[pid]=Date.now();
  db.doc('posts/'+p.id).update({locks:{[pid]:{uid,at:Date.now()}}}).catch(()=>{});
}
async function release(p){
  const o={};for(const k in (p.locks||{}))if(p.locks[k].uid===uid)o[k]={uid:null,at:0};
  if(Object.keys(o).length)try{await db.doc('posts/'+p.id).update({locks:o})}catch(e){}
}
async function mutate(p,fn,msg){
  try{
    const fresh=(await db.doc('posts/'+p.id).get()).data();if(!fresh)return toast('이미 삭제된 글이에요.');
    await db.doc('posts/'+p.id).update({paras:fn(fresh.paras||[]),updatedAt:Date.now()});
    if(msg)toast(msg);
  }catch(e){fail(e)}
}
async function savePara(p,pid){
  const v=dirty[pid];if(v===undefined)return toast('바뀐 내용이 없어요.');
  await mutate(p,ps=>ps.map(x=>x.id===pid?{id:pid,text:v}:x),'문단을 저장했어요.');
  delete dirty[pid];
  db.doc('posts/'+p.id).update({locks:{[pid]:{uid:null,at:0}}}).catch(()=>{});
}
const delPara=(p,pid)=>{delete dirty[pid];return mutate(p,ps=>ps.filter(x=>x.id!==pid),'문단을 삭제했어요.')};
async function saveFmt(p){try{await db.doc('posts/'+p.id).update({fmt:{...dirty.fmt},updatedAt:Date.now()});toast('서식을 저장했어요.')}catch(e){fail(e)}}
async function saveTitle(p){

  try{await db.doc('posts/'+p.id).update({title:v,updatedAt:Date.now()});delete dirty.title;toast('제목을 저장했어요.')}catch(e){fail(e)}
}

const tbl=n=>n==='meta'?'board_meta':n;
function ref(path){
  const[t,id0]=path.split('/'),T=tbl(t),id=t==='meta'?1:id0;
  return{
    async get(){const{data,error}=await sb.from(T).select('*').eq('id',id).maybeSingle();if(error)throw error;return{data:()=>data?mapK(data,camel):null}},
    async update(d){d=mapK(d,snake);
      if(d.locks){const{data}=await sb.from(T).select('locks').eq('id',id).maybeSingle();d.locks={...((data&&data.locks)||{}),...d.locks}}
      const{error}=await sb.from(T).update(d).eq('id',id);if(error)throw error},
    async set(d){d=mapK(d,snake);const{error}=await sb.from(T).upsert({id,...d});if(error)throw error},
    async delete(){const{error}=await sb.from(T).delete().eq('id',id);if(error)throw error}};
}
const dbShim={doc:ref,collection:n=>({async add(d){const{error}=await sb.from(tbl(n)).insert(mapK(d,snake));if(error)throw error}})};
